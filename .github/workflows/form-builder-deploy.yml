# Builds the form builder (form-builder/) and deploys it to https://form-builder.tl.techmatters.org:
# the page to its S3 bucket and the API's code to its Lambda. The AWS resources themselves come
# from form-builder/terraform/aws; the names below are its defaults.

name: 'Deploy form builder'

# While it's a proof of concept, every push to its branch that touches form-builder/ deploys it.
# (A manual-only workflow can't be started until it's on master.) The flow designer's branch holds
# everything in alejandro-c/form_builder_app as well, so it's the one deployed; fixes made there are
# merged into it to go live.
on:
  workflow_dispatch:
  push:
    branches:
      - alejandro-c/flow_designer
    paths:
      - 'form-builder/**'
      - '.github/workflows/form-builder-deploy.yml'

concurrency:
  group: form-builder-deploy
  cancel-in-progress: false

env:
  SITE_BUCKET: tl-form-builder-site
  LAMBDA_FUNCTION: form-builder-api
  SITE_DOMAIN: form-builder.tl.techmatters.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: form-builder/package-lock.json

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: |
          npx vite build
          npm run build:lambda
          (cd dist-lambda && zip -q ../lambda.zip index.mjs)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Until form-builder/terraform/aws is applied there's nothing to deploy to
      - name: Check the AWS resources exist
        id: resources
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: the form builder's AWS resources don't exist yet (apply form-builder/terraform/aws first)."
          fi

      - name: Deploy the API
        if: steps.resources.outputs.ready == 'true'
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --zip-file fileb://lambda.zip > /dev/null
          # function-updated-v2 polls with lambda:GetFunction, which the deploy policy allows
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

      # Hashed assets can be cached for good; index.html must always be checked. config.json is
      # written by Terraform, so it's left alone.
      - name: Deploy the page
        if: steps.resources.outputs.ready == 'true'
        run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "assets/*" --exclude "config.json" --cache-control "no-cache"

      - name: Refresh CloudFront
        if: steps.resources.outputs.ready == 'true'
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, '$SITE_DOMAIN')].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" > /dev/null
